name: E2E Smoke

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    name: Gateway login, command execution and audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.25.14"
          cache-dependency-path: |
            backend/agent/go.sum
            backend/gateway/go.sum
            backend/cli/go.sum
      - name: Run real E2E smoke on Linux
        run: bash deploy/e2e/smoke.sh --mode process
      - name: Preserve sanitized failure logs
        if: failure() && env.DOOPS_E2E_LOG_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-failure-logs
          path: ${{ env.DOOPS_E2E_LOG_DIR }}
          if-no-files-found: error
          retention-days: 7
