name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Reused by .github/workflows/release.yml as the release gate.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/agent/go.mod
          cache-dependency-path: |
            backend/agent/go.sum
            backend/gateway/go.sum
            backend/cli/go.sum

      - name: Test agent
        working-directory: backend/agent
        run: go test ./...

      - name: Test gateway
        working-directory: backend/gateway
        run: go test ./...

      - name: Test CLI
        working-directory: backend/cli
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@11.7.0 --activate

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test gateway proxy policy
        run: pnpm test:gateway-policy

      - name: Typecheck web console
        run: pnpm exec tsc --noEmit

      - name: Build web console
        run: pnpm build

  secret-scan:
    name: Secret scan
    # Branch pushes and pull requests carry the commit range gitleaks should scan.
    # The release workflow reuses this workflow for tag pushes and manual
    # dispatch, where gitleaks would scan the full history (historical fixtures
    # and canaries) instead of a change; those commits were already scanned when
    # they landed on main.
    if: >-
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
