name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # Reused by .github/workflows/release.yml as the release gate.
  workflow_call:
    inputs:
      source_commit:
        description: "Exact source commit selected by the release workflow"
        required: true
        type: string

permissions:
  contents: read

# Every push used to queue a full run behind the previous one: a three-commit burst
# left older trees testing for half an hour after they were already obsolete, and the
# newest tree waited behind them. A superseded push carries no signal, so cancel it.
# The release gate (workflow_call) gets its own group and is never cancelled, and a
# pull_request run is left alone because a review may be reading it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.14"
          cache-dependency-path: |
            backend/agent/go.sum
            backend/gateway/go.sum
            backend/cli/go.sum

      - name: Install Go test dependencies
        run: python3 -m pip install --quiet pyyaml

      - name: Test agent
        working-directory: backend/agent
        run: go test -timeout 20m ./...

      - name: Test gateway
        working-directory: backend/gateway
        run: go test -timeout 20m ./...

      - name: Test CLI
        working-directory: backend/cli
        run: go test -timeout 20m ./...

  web:
    name: Web console checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Test gateway proxy policy
        run: pnpm test:gateway-policy

      - name: Test web console
        run: pnpm test:console

      - name: Test DoSql
        run: pnpm test:dosql

      - name: Typecheck web console
        run: pnpm exec tsc --noEmit

      - name: Build web console
        run: pnpm build

  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python3 -m pip install --quiet pytest pyyaml

      - name: Run contract tests
        working-directory: backend
        run: python3 -m pytest test -q

  skills-packages:
    name: Skill packages (real-run)
    # Runs the bundled inspection Skill packages inside containers (static contracts,
    # artifact protocol, disk-dedup fixtures and the malformed-environment matrix).
    # The test image is built here from a public base because the dedup/loop fixtures
    # need mkfs.ext4 and util-linux; CI verifies script logic and the artifact
    # protocol, while production image parity is owned by the release flow
    # (backend/docs/BUILD_DEPLOY_SOP.md, sections 3-4). A failed build or a missing
    # image fails this job - nothing is skipped silently.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get -y install shellcheck

      - name: Build inspection test image
        run: |
          docker build --quiet -t sb01-inspect-test:ci - <<'DOCKERFILE'
          FROM python:3.12-slim
          RUN apt-get update \
              && apt-get install -y --no-install-recommends e2fsprogs util-linux \
              && rm -rf /var/lib/apt/lists/*
          DOCKERFILE

      - name: Pull the no-python fallback image
        # verify.sh treats a missing image as a hard failure rather than pulling
        # it implicitly, so the fallback image used by the degraded-path checks
        # has to be present before the verifier runs.
        run: |
          for attempt in 1 2 3; do
            docker pull alpine:3 && exit 0
            echo "docker pull alpine:3 failed (attempt $attempt)" >&2
            sleep 5
          done
          exit 1

      - name: Verify bundled inspection packages
        env:
          SB01_IMG_PYTHON: sb01-inspect-test:ci
          SB01_IMG_SHELL: alpine:3
        run: sh backend/agent/internal/server/testdata/skills_builtin_verify/verify.sh

  secret-scan:
    name: Secret scan
    # Branch pushes and pull requests carry the commit range gitleaks should scan.
    # The release workflow reuses this workflow for tag pushes and manual
    # dispatch, where gitleaks would scan the full history (historical fixtures
    # and canaries) instead of a change; those commits were already scanned when
    # they landed on main.
    if: >-
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_commit || github.sha }}

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
