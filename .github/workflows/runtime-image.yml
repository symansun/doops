name: Publish runtime image

on:
  workflow_dispatch:
    inputs:
      source-image:
        description: Exact existing runtime image repository@sha256 digest to migrate
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-runtime-image
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Copy and verify runtime manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install registry tools
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Authenticate to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | skopeo login --username "$GITHUB_ACTOR" --password-stdin ghcr.io
      - name: Publish exact runtime and verify identity
        env:
          SOURCE_IMAGE: ${{ inputs.source-image }}
        run: |
          echo "::add-mask::$SOURCE_IMAGE"
          test "$GITHUB_REF" = refs/heads/main
          source backend/runtime-versions.env
          [[ "$SOURCE_IMAGE" == *@"$DO_AGENT_INDEX_DIGEST" ]]
          destination="ghcr.io/symansun/doops-runtime:v$DO_AGENT_VERSION"
          if skopeo inspect --raw "docker://$destination" > "$RUNNER_TEMP/existing-runtime.json" 2> "$RUNNER_TEMP/runtime-probe-error"; then
            existing="sha256:$(sha256sum "$RUNNER_TEMP/existing-runtime.json" | cut -d ' ' -f 1)"
            test "$existing" = "$DO_AGENT_INDEX_DIGEST" || { echo "Existing runtime tag has another immutable digest" >&2; exit 1; }
          else
            grep -Eqi 'manifest unknown|manifest_unknown|name unknown|name_unknown' "$RUNNER_TEMP/runtime-probe-error" || { cat "$RUNNER_TEMP/runtime-probe-error" >&2; exit 1; }
            skopeo copy --all --preserve-digests "docker://$SOURCE_IMAGE" "docker://$destination"
          fi
          skopeo inspect --raw "docker://$destination" > "$RUNNER_TEMP/runtime-manifest.json"
          actual="sha256:$(sha256sum "$RUNNER_TEMP/runtime-manifest.json" | cut -d ' ' -f 1)"
          test "$actual" = "$DO_AGENT_INDEX_DIGEST"
          pinned="$destination@$actual"
          skopeo inspect --no-creds --raw "docker://$pinned" > "$RUNNER_TEMP/public-runtime.json" || { echo "Set the GHCR runtime package visibility to public before releasing" >&2; exit 1; }
          test "sha256:$(sha256sum "$RUNNER_TEMP/public-runtime.json" | cut -d ' ' -f 1)" = "$actual"
          docker pull --platform "$DO_AGENT_PLATFORM" "$pinned"
          test "$(docker run --rm --entrypoint /usr/local/bin/do-agent "$pinned" --version)" = "do-agent $DO_AGENT_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$pinned")" = "$DO_AGENT_REVISION"
          printf 'Verified GitHub runtime: %s\n' "$pinned" >> "$GITHUB_STEP_SUMMARY"
