name: Demo Health

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    if: vars.DOOPS_DEMO_BASE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEMO_BASE_URL: ${{ vars.DOOPS_DEMO_BASE_URL }}
    steps:
      - name: Verify public health
        run: |
          [[ "$DEMO_BASE_URL" == https://* ]]
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 "$DEMO_BASE_URL/health")
          test "$code" = 200
      - name: Verify password authentication
        env:
          DOOPS_DEMO_PASSWORD: ${{ secrets.DOOPS_DEMO_PASSWORD }}
          DOOPS_DEMO_USERNAME: ${{ vars.DOOPS_DEMO_USERNAME }}
        run: |
          : "${DOOPS_DEMO_PASSWORD:?Configure a synthetic demo password}"
          : "${DOOPS_DEMO_USERNAME:?Configure the demo account}"
          umask 077
          temporary=$(mktemp -d)
          trap 'rm -rf "$temporary"' EXIT
          python3 - "$temporary/login.json" <<'PY'
          import json, os, sys
          with open(sys.argv[1], "w") as destination:
              json.dump({"username": os.environ["DOOPS_DEMO_USERNAME"], "password": os.environ["DOOPS_DEMO_PASSWORD"], "name": "demo-health"}, destination)
          PY
          code=$(curl --silent --show-error --output "$temporary/response.json" --write-out '%{http_code}' --max-time 20 \
            --header 'Content-Type: application/json' --data-binary "@$temporary/login.json" "$DEMO_BASE_URL/v1/auth/login")
          test "$code" = 200
          python3 - "$temporary/response.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as response:
              value = json.load(response)
          assert isinstance(value.get("token"), str) and value["token"], "login response missing token"
          PY
