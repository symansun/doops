name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: skills/doops-cli/cli/doops/go.mod

      - name: Build CLI binaries
        working-directory: skills/doops-cli/cli/doops
        run: |
          set -e
          mkdir -p /tmp/dist
          for t in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64; do
            GOOS=${t%-*} GOARCH=${t#*-} CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' -o /tmp/dist/doops-$t .
          done

      - name: Build agent and gateway binaries (linux)
        working-directory: agent
        run: |
          set -e
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' -o /tmp/dist/doops-agent-linux-$arch ./cmd/agent
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 \
              go build -trimpath -ldflags='-s -w' -o /tmp/dist/doops-gateway-linux-$arch ./cmd/gateway
          done

      - name: Checksums
        run: cd /tmp/dist && shasum -a 256 * > checksums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/dist/*
          generate_release_notes: true
