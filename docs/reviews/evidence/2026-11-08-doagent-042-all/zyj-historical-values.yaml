# Historical Helm values evidence only; NOT approved deployment input.
# Contains duplicate nerdctl-data volume and differs from the live Pod spec.
doagentSettings:
  key: settings.json
  secretName: doagent-model-settings
gateway:
  cluster: doops-zyj
  instance: zyj
  url: https://doops.l8ai.cn
hostAliases: []
image:
  digest: sha256:5c6055a7b7a2e4fbab4064cf1c20268b166e7e3915da3e9e92dd42cd011db854
  pullPolicy: IfNotPresent
  repository: docker.cnb.cool/l8ai/ai/doops.sh
imagePullSecrets: []
modelRouting:
  policy: single-model
nodeSelector:
  kubernetes.io/hostname: vm-0-11
proxy:
  allowedHosts: ''
tolerations: []
volumeMounts:
- mountPath: /etc/kubernetes/admin.conf
  name: kube-admin
  readOnly: true
- mountPath: /root/.kube/config
  name: kube-admin
  readOnly: true
- mountPath: /root
  name: agent-home
- mountPath: /run/containerd
  name: containerd-run
- mountPath: /var/lib/containerd
  name: containerd-data
- mountPath: /var/lib/nerdctl
  name: nerdctl-data
volumes:
- hostPath:
    path: /etc/kubernetes/admin.conf
    type: File
  name: kube-admin
- hostPath:
    path: /data/doops-agent-home
    type: DirectoryOrCreate
  name: agent-home
- hostPath:
    path: /run/containerd
    type: Directory
  name: containerd-run
- hostPath:
    path: /var/lib/containerd
    type: Directory
  name: containerd-data
- hostPath:
    path: /var/lib/nerdctl
    type: Directory
  name: nerdctl-data
- hostPath:
    path: /var/lib/nerdctl
    type: DirectoryOrCreate
  name: nerdctl-data
workload:
  name: doops-agent
  selectorLabels:
    app: doops-agent
