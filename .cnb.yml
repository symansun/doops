main:
  pull_request:
    - name: ai-review
      stages:
        - name: AI code review
          image: cnbcool/code-review:latest
          settings:
            comment: true
            max_comments: 10
            fail_on_critical: false
    - name: ci-contracts
      runner:
        cpus: 2
      docker:
        image: docker.io/library/golang:1.25-alpine@sha256:1ae0735f00daffa3aaf1363a5184c0d2dc55c78e3db4ec70241cdac97bf84b59
      stages:
        - name: prepare tools
          script: apk add --no-cache bash build-base git helm nodejs npm openssh-client python3 py3-pytest py3-yaml
        - name: release contract tests
          script: python3 -m pytest backend/test -q
        - name: Linux agent execution tests
          timeout: 15m
          script: |
            cd backend/agent
            go test ./... -count=1 -timeout=10m
        - name: Linux gateway tests
          script: |
            cd backend/gateway
            go test ./... -count=1 -timeout=5m
        - name: Linux cli tests
          script: |
            cd backend/cli
            go test ./... -count=1 -timeout=5m
        - name: Linux Git process acceptance
          timeout: 15m
          script: |
            cd backend/agent
            go test -race ./internal/server -run 'TestGitHTTP|TestAgentGitCancellation|TestExecutionGuard|TestExecutionLifecycle|TestBackgroundRPC' -count=1 -timeout=10m
        - name: web acceptance checks
          timeout: 10m
          script: |
            npm i -g pnpm@11.7.0
            pnpm install --frozen-lockfile
            pnpm test:gateway-policy
            pnpm test:console
            pnpm exec tsc --noEmit
            pnpm build
  push:
    - name: ci
      runner:
        cpus: 4
      services:
        - docker
        # Declaring vscode runs this pipeline on cloud-dev nodes, billed on the
        # cloud-dev quota instead of the build quota. Nobody connects to the
        # environment, so keep it alive past the default 10-minute idle recycle.
        - name: vscode
          options:
            keepAliveTimeout: 2h
      docker:
        image: docker.io/library/golang:1.25-alpine@sha256:1ae0735f00daffa3aaf1363a5184c0d2dc55c78e3db4ec70241cdac97bf84b59
      stages:
        - name: prepare tools
          script: apk add --no-cache bash docker-cli git helm nodejs npm openssh-client python3 py3-pytest py3-yaml
        - name: release contract tests
          script: python3 -m pytest backend/test -q
        - name: agent tests
          timeout: 25m
          script: |
            cd backend/agent
            # The runner closes a stage after 10 minutes without output. go test
            # stays silent while compiling and while a package is still running.
            ( while true; do sleep 30; echo "agent tests still running $(date -u +%H:%M:%S)"; done ) &
            heartbeat=$!
            trap 'kill "$heartbeat" 2>/dev/null || true' EXIT
            go test ./... -count=1 -timeout=20m
        - name: gateway tests
          script: |
            cd backend/gateway
            go test ./...
        - name: cli tests
          script: |
            cd backend/cli
            go test ./...
        - name: web build
          script: |
            npm i -g pnpm@11.7.0
            pnpm install --frozen-lockfile
            pnpm test:gateway-policy
            pnpm test:console
            pnpm exec tsc --noEmit
            pnpm build
        - name: resolve immutable agent base
          # Reuses the base for unchanged backend/runtime-versions.env and Dockerfile.base.light inputs.
          script: |
            DOOPS_BASE_IMAGE_OUTPUT="${PWD}/backend/.ci-agent-base-image" \
              bash backend/scripts/resolve-agent-base-image.sh
        - name: build immutable agent images
          script: |
            if [ -s backend/.ci-agent-base-image ]; then
              export DOOPS_AGENT_BASE_IMAGE_OVERRIDE="$(
                cat backend/.ci-agent-base-image
              )"
            fi
            DOOPS_PUBLISH_LATEST=1 \
            DOOPS_RELEASE_TAG="${CNB_COMMIT}" \
              bash backend/scripts/build-agent-image.sh
        - name: build immutable web image
          script: DOOPS_PUBLISH_LATEST=1 DOOPS_RELEASE_TAG="${CNB_COMMIT}" bash backend/scripts/build-web-image.sh
  api_trigger_deploy_agent:
    - name: deploy business workload through natural-language apply
      runner:
        cpus: 2
      imports:
        - https://cnb.cool/aiedulab/zhiyong/secret/-/blob/main/zhiyong-deploy-secrets.yml
      docker:
        image: docker.io/library/golang:1.25-alpine@sha256:1ae0735f00daffa3aaf1363a5184c0d2dc55c78e3db4ec70241cdac97bf84b59
      stages:
        - name: prepare Gateway CLI
          script: |
            set -eu
            test "${CNB_BRANCH}" = "main"
            apk add --no-cache bash git
            : "${DOOPS_GATEWAY_TOKEN:?DOOPS_GATEWAY_TOKEN is required}"
            : "${DOOPS_SESSION:?DOOPS_SESSION is required}"
            : "${DOOPS_TARGET:?DOOPS_TARGET is required}"
            : "${DOOPS_CLUSTER:?DOOPS_CLUSTER is required}"
            : "${DOOPS_INSTANCE:?DOOPS_INSTANCE is required}"
            ROOT="${PWD}"
            export HOME="${PWD}/.ci-doops-home"
            mkdir -p "${HOME}" .ci-bin
            (
              cd backend/cli
              go build -o "${ROOT}/.ci-bin/doops" ./cli/doops
            )
            .ci-bin/doops add \
              --name "${DOOPS_TARGET}" \
              --gateway "https://doops.l8ai.cn" \
              --cluster "${DOOPS_CLUSTER}" \
              --instance "${DOOPS_INSTANCE}" \
              --use "CNB natural-language release"
            printf '%s' "${DOOPS_GATEWAY_TOKEN}" |
              .ci-bin/doops -session "${DOOPS_SESSION}" login --target "${DOOPS_TARGET}" --token-stdin
            .ci-bin/doops -session "${DOOPS_SESSION}" targets --target "${DOOPS_TARGET}"
        - name: publish through Gateway
          script: |
            set -eu
            : "${DOOPS_SESSION:?DOOPS_SESSION is required}"
            : "${DOOPS_TARGET:?DOOPS_TARGET is required}"
            : "${DOOPS_IMAGE:?DOOPS_IMAGE is required}"
            : "${DOOPS_SERVICE_SCOPE:?DOOPS_SERVICE_SCOPE is required}"
            : "${DOOPS_HELM_ASSET:?DOOPS_HELM_ASSET remote chart URL is required}"
            : "${DOOPS_CHANGE_REASON:?DOOPS_CHANGE_REASON is required}"
            : "${DOOPS_ACCEPTANCE:?DOOPS_ACCEPTANCE is required}"
            validate_simple_name() {
              case "$1" in
                ""|"."|".."|*[!A-Za-z0-9._-]*)
                  echo "invalid $2" >&2
                  exit 2
                  ;;
              esac
            }
            validate_single_line() {
              carriage_return="$(printf '\r')"
              if [ -z "$1" ] || [ "$(printf '%s' "$1" | wc -l)" -ne 0 ]; then
                echo "invalid $2" >&2
                exit 2
              fi
              case "$1" in
                *"${carriage_return}"*)
                  echo "invalid $2" >&2
                  exit 2
                  ;;
              esac
            }
            validate_simple_name "${DOOPS_SESSION}" "DOOPS_SESSION"
            validate_simple_name "${DOOPS_TARGET}" "DOOPS_TARGET"
            if [ -n "${DOOPS_CREDENTIAL:-}" ]; then
              validate_simple_name "${DOOPS_CREDENTIAL}" "DOOPS_CREDENTIAL"
            fi
            validate_single_line "${DOOPS_SERVICE_SCOPE}" "DOOPS_SERVICE_SCOPE"
            validate_single_line "${DOOPS_HELM_ASSET}" "DOOPS_HELM_ASSET"
            validate_single_line "${DOOPS_CHANGE_REASON}" "DOOPS_CHANGE_REASON"
            validate_single_line "${DOOPS_ACCEPTANCE}" "DOOPS_ACCEPTANCE"
            case "${DOOPS_IMAGE}" in
              *@sha256:*) ;;
              *)
                echo "invalid DOOPS_IMAGE" >&2
                exit 2
                ;;
            esac
            image_repository="${DOOPS_IMAGE%@sha256:*}"
            image_digest="${DOOPS_IMAGE##*@sha256:}"
            case "${image_repository}" in
              ""|*[!A-Za-z0-9._:/-]*)
                echo "invalid DOOPS_IMAGE repository" >&2
                exit 2
                ;;
            esac
            case "${image_digest}" in
              *[!a-f0-9]*)
                echo "invalid DOOPS_IMAGE digest" >&2
                exit 2
                ;;
            esac
            test "${#image_digest}" -eq 64
            case "${DOOPS_HELM_ASSET}" in
              https://*) ;;
              *)
                echo "DOOPS_HELM_ASSET must be an explicit https:// chart URL" >&2
                exit 2
                ;;
            esac
            export HOME="${PWD}/.ci-doops-home"
            instruction="在 ${DOOPS_TARGET} 发布 ${DOOPS_SERVICE_SCOPE}，镜像 ${DOOPS_IMAGE}；使用 chart ${DOOPS_HELM_ASSET}；原因：${DOOPS_CHANGE_REASON}；验收：${DOOPS_ACCEPTANCE}。"
            if [ -n "${DOOPS_CREDENTIAL:-}" ]; then
              .ci-bin/doops -session "${DOOPS_SESSION}" ask \
                --target "${DOOPS_TARGET}" \
                --apply \
                --credential "${DOOPS_CREDENTIAL}" \
                --msg "${instruction}"
            else
              .ci-bin/doops -session "${DOOPS_SESSION}" ask \
                --target "${DOOPS_TARGET}" \
                --apply \
                --msg "${instruction}"
            fi
