main:
  pull_request:
    - name: ai-review
      stages:
        - name: AI code review
          image: cnbcool/code-review:latest
          settings:
            comment: true
            max_comments: 10
            fail_on_critical: false
    - name: ci-contracts
      runner:
        cpus: 2
      docker:
        image: docker.io/library/golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191
      stages:
        - name: prepare tools
          script: apk add --no-cache bash git helm nodejs npm python3 py3-pytest py3-yaml
        - name: release contract tests
          script: python3 -m pytest backend/test -q
  push:
    - name: ci
      runner:
        cpus: 4
      services:
        - docker
      docker:
        image: docker.io/library/golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191
      stages:
        - name: prepare tools
          script: apk add --no-cache bash docker-cli git helm nodejs npm python3 py3-pytest py3-yaml
        - name: release contract tests
          script: python3 -m pytest backend/test -q
        - name: agent tests
          script: |
            cd backend/agent
            go test ./...
        - name: gateway tests
          script: |
            cd backend/gateway
            go test ./...
        - name: cli tests
          script: |
            cd backend/skills/doops-cli
            go test ./...
        - name: web build
          script: |
            npm i -g pnpm@11.7.0
            pnpm install --frozen-lockfile
            pnpm test:gateway-policy
            pnpm exec tsc --noEmit
            pnpm build
        - name: build immutable agent images
          script: DOOPS_RELEASE_TAG="${CNB_COMMIT}" bash backend/scripts/build-agent-image.sh
        - name: build immutable web image
          script: DOOPS_RELEASE_TAG="${CNB_COMMIT}" bash backend/scripts/build-web-image.sh
  api_trigger_deploy_agent:
    - name: deploy agent through natural-language apply
      runner:
        cpus: 2
      imports:
        - https://cnb.cool/aiedulab/zhiyong/secret/-/blob/main/zhiyong-deploy-secrets.yml
      docker:
        image: docker.io/library/golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191
      stages:
        - name: prepare Gateway CLI
          script: |
            set -eu
            test "${CNB_BRANCH}" = "main"
            apk add --no-cache bash git
            : "${DOOPS_GATEWAY_TOKEN:?DOOPS_GATEWAY_TOKEN is required}"
            : "${DOOPS_TARGET:?DOOPS_TARGET is required}"
            : "${DOOPS_CLUSTER:?DOOPS_CLUSTER is required}"
            : "${DOOPS_INSTANCE:?DOOPS_INSTANCE is required}"
            ROOT="${PWD}"
            export HOME="${PWD}/.ci-doops-home"
            mkdir -p "${HOME}" .ci-bin
            (
              cd backend/skills/doops-cli
              go build -o "${ROOT}/.ci-bin/doops" ./cli/doops
            )
            .ci-bin/doops add \
              --name "${DOOPS_TARGET}" \
              --gateway "https://doops.l8ai.cn" \
              --cluster "${DOOPS_CLUSTER}" \
              --instance "${DOOPS_INSTANCE}" \
              --use "CNB natural-language release"
            printf '%s' "${DOOPS_GATEWAY_TOKEN}" |
              .ci-bin/doops login --target "${DOOPS_TARGET}" --token-stdin
            .ci-bin/doops targets --target "${DOOPS_TARGET}"
        - name: publish through Gateway
          script: |
            set -eu
            : "${DOOPS_SESSION:?DOOPS_SESSION is required}"
            : "${DOOPS_TARGET:?DOOPS_TARGET is required}"
            : "${DOOPS_IMAGE:?DOOPS_IMAGE is required}"
            : "${DOOPS_SERVICE_SCOPE:?DOOPS_SERVICE_SCOPE is required}"
            : "${DOOPS_HELM_ASSET:?DOOPS_HELM_ASSET is required}"
            : "${DOOPS_CHANGE_REASON:?DOOPS_CHANGE_REASON is required}"
            : "${DOOPS_ACCEPTANCE:?DOOPS_ACCEPTANCE is required}"
            printf '%s' "${DOOPS_IMAGE}" | grep -Eq '@sha256:[a-f0-9]{64}$'
            printf '%s' "${DOOPS_HELM_ASSET}" | grep -Eq '^deploy/helm/[A-Za-z0-9._/-]+/?$'
            export HOME="${PWD}/.ci-doops-home"
            .ci-bin/doops -session "${DOOPS_SESSION}" push \
              --target "${DOOPS_TARGET}" \
              --src backend
            instruction="在 ${DOOPS_TARGET} 发布 ${DOOPS_SERVICE_SCOPE}，镜像 ${DOOPS_IMAGE}；仅使用 ${DOOPS_HELM_ASSET}；原因：${DOOPS_CHANGE_REASON}；验收：${DOOPS_ACCEPTANCE}。"
            if [ -n "${DOOPS_CREDENTIAL:-}" ]; then
              .ci-bin/doops -session "${DOOPS_SESSION}" ask \
                --target "${DOOPS_TARGET}" \
                --apply \
                --credential "${DOOPS_CREDENTIAL}" \
                --msg "${instruction}"
            else
              .ci-bin/doops -session "${DOOPS_SESSION}" ask \
                --target "${DOOPS_TARGET}" \
                --apply \
                --msg "${instruction}"
            fi
  api_trigger_bootstrap_release_runner:
    - name: bootstrap isolated agent release controller
      runner:
        cpus: 2
      imports:
        - https://cnb.cool/aiedulab/zhiyong/secret/-/blob/main/zhiyong-deploy-secrets.yml
      docker:
        image: docker.io/library/golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191
      stages:
        - name: prepare managed target
          script: |
            set -eu
            test "${CNB_BRANCH}" = "main"
            apk add --no-cache bash git
            : "${DOOPS_GATEWAY_TOKEN:?DOOPS_GATEWAY_TOKEN is required}"
            : "${DOOPS_TARGET:?DOOPS_TARGET is required}"
            : "${DOOPS_CLUSTER:?DOOPS_CLUSTER is required}"
            : "${DOOPS_INSTANCE:?DOOPS_INSTANCE is required}"
            ROOT="${PWD}"
            export HOME="${PWD}/.ci-doops-home"
            mkdir -p "${HOME}" .ci-bin
            (
              cd backend/skills/doops-cli
              go build -o "${ROOT}/.ci-bin/doops" ./cli/doops
            )
            .ci-bin/doops add \
              --name "${DOOPS_TARGET}" \
              --gateway "https://doops.l8ai.cn" \
              --cluster "${DOOPS_CLUSTER}" \
              --instance "${DOOPS_INSTANCE}" \
              --use "CNB release controller bootstrap"
            printf '%s' "${DOOPS_GATEWAY_TOKEN}" |
              .ci-bin/doops login --target "${DOOPS_TARGET}" --token-stdin
            .ci-bin/doops targets --target "${DOOPS_TARGET}"
        - name: install isolated release runner
          script: |
            set -eu
            : "${DOOPS_SESSION:?DOOPS_SESSION is required}"
            : "${DOOPS_NAMESPACE:?DOOPS_NAMESPACE is required}"
            : "${DOOPS_MANAGED_RELEASE:?DOOPS_MANAGED_RELEASE is required}"
            : "${DOOPS_RUNNER_TARGET:?DOOPS_RUNNER_TARGET is required}"
            : "${DOOPS_RUNNER_RELEASE:?DOOPS_RUNNER_RELEASE is required}"
            : "${DOOPS_RUNNER_WORKLOAD:?DOOPS_RUNNER_WORKLOAD is required}"
            : "${DOOPS_RUNNER_INSTANCE:?DOOPS_RUNNER_INSTANCE is required}"
            : "${DOOPS_RUNNER_HOME:?DOOPS_RUNNER_HOME is required}"
            : "${DOOPS_IMAGE:?DOOPS_IMAGE is required}"
            validate_simple_name() {
              case "$1" in
                ""|"."|".."|*[!A-Za-z0-9._-]*)
                  echo "invalid $2" >&2
                  exit 2
                  ;;
              esac
            }
            validate_dns_name() {
              case "$1" in
                ""|*[!a-z0-9-]*|-*|*-)
                  echo "invalid $2" >&2
                  exit 2
                  ;;
              esac
            }
            validate_simple_name "${DOOPS_SESSION}" "DOOPS_SESSION"
            validate_simple_name "${DOOPS_RUNNER_TARGET}" "DOOPS_RUNNER_TARGET"
            for value in \
              "${DOOPS_NAMESPACE}" \
              "${DOOPS_MANAGED_RELEASE}" \
              "${DOOPS_RUNNER_RELEASE}" \
              "${DOOPS_RUNNER_WORKLOAD}" \
              "${DOOPS_RUNNER_INSTANCE}"; do
              validate_dns_name "${value}" "Kubernetes name"
            done
            case "${DOOPS_RUNNER_HOME}" in
              /*) ;;
              *)
                echo "invalid DOOPS_RUNNER_HOME" >&2
                exit 2
                ;;
            esac
            case "${DOOPS_RUNNER_HOME}" in
              *[!A-Za-z0-9._/-]*)
                echo "invalid DOOPS_RUNNER_HOME" >&2
                exit 2
                ;;
            esac
            case "/${DOOPS_RUNNER_HOME#/}/" in
              */../*)
                echo "invalid DOOPS_RUNNER_HOME" >&2
                exit 2
                ;;
            esac
            case "${DOOPS_IMAGE}" in
              *@sha256:*) ;;
              *)
                echo "invalid DOOPS_IMAGE" >&2
                exit 2
                ;;
            esac
            image_repository="${DOOPS_IMAGE%@sha256:*}"
            image_digest="${DOOPS_IMAGE##*@sha256:}"
            case "${image_repository}" in
              ""|*[!A-Za-z0-9._:/-]*)
                echo "invalid DOOPS_IMAGE repository" >&2
                exit 2
                ;;
            esac
            case "${image_digest}" in
              *[!a-f0-9]*)
                echo "invalid DOOPS_IMAGE digest" >&2
                exit 2
                ;;
            esac
            test "${#image_digest}" -eq 64
            test "${DOOPS_RUNNER_TARGET}" != "${DOOPS_TARGET}"
            test "${DOOPS_RUNNER_RELEASE}" != "${DOOPS_MANAGED_RELEASE}"
            test "${DOOPS_RUNNER_INSTANCE}" != "${DOOPS_INSTANCE}"
            export HOME="${PWD}/.ci-doops-home"
            .ci-bin/doops -session "${DOOPS_SESSION}" push \
              --target "${DOOPS_TARGET}" \
              --src backend
            command="bash /root/ws/${DOOPS_SESSION}/scripts/bootstrap-release-runner.sh --namespace ${DOOPS_NAMESPACE} --managed-release ${DOOPS_MANAGED_RELEASE} --runner-release ${DOOPS_RUNNER_RELEASE} --runner-workload ${DOOPS_RUNNER_WORKLOAD} --runner-instance ${DOOPS_RUNNER_INSTANCE} --runner-home ${DOOPS_RUNNER_HOME} --image ${DOOPS_IMAGE}"
            .ci-bin/doops -session "${DOOPS_SESSION}" exec \
              --target "${DOOPS_TARGET}" \
              --cmd "${command}"
            .ci-bin/doops add \
              --name "${DOOPS_RUNNER_TARGET}" \
              --gateway "https://doops.l8ai.cn" \
              --cluster "${DOOPS_CLUSTER}" \
              --instance "${DOOPS_RUNNER_INSTANCE}" \
              --use "CNB isolated release controller"
            for attempt in $(seq 1 30); do
              if .ci-bin/doops targets --target "${DOOPS_RUNNER_TARGET}"; then
                exit 0
              fi
              sleep 2
            done
            cleanup_command="helm uninstall ${DOOPS_RUNNER_RELEASE} --namespace ${DOOPS_NAMESPACE} --wait --timeout 5m"
            if ! .ci-bin/doops -session "${DOOPS_SESSION}" exec \
              --target "${DOOPS_TARGET}" \
              --cmd "${cleanup_command}"; then
              echo "release runner did not register and cleanup failed" >&2
              exit 1
            fi
            echo "release runner did not register; temporary release removed" >&2
            exit 1

