main:
  pull_request:
    - name: public-ci
      runner:
        cpus: 4
      docker:
        image: docker.io/library/golang:1.25-alpine
      stages:
        - name: prepare tools
          script: apk add --no-cache bash build-base git helm nodejs npm python3 py3-pytest py3-yaml
        - name: contract tests
          script: python3 -m pytest backend/test -q
        - name: agent tests
          timeout: 20m
          script: |
            cd backend/agent
            go test ./... -count=1 -timeout=15m
        - name: gateway tests
          script: |
            cd backend/gateway
            go test ./... -count=1 -timeout=5m
        - name: cli tests
          script: |
            cd backend/cli
            go test ./... -count=1 -timeout=5m
        - name: web checks
          timeout: 15m
          script: |
            npm i -g pnpm@11.7.0
            pnpm install --frozen-lockfile
            pnpm test:gateway-policy
            pnpm test:console
            pnpm exec tsc --noEmit
            pnpm build
  push:
    - name: public-ci
      runner:
        cpus: 4
      docker:
        image: docker.io/library/golang:1.25-alpine
      stages:
        - name: prepare tools
          script: apk add --no-cache bash build-base git helm nodejs npm python3 py3-pytest py3-yaml
        - name: contract tests
          script: python3 -m pytest backend/test -q
        - name: agent tests
          timeout: 20m
          script: |
            cd backend/agent
            go test ./... -count=1 -timeout=15m
        - name: gateway tests
          script: |
            cd backend/gateway
            go test ./... -count=1 -timeout=5m
        - name: cli tests
          script: |
            cd backend/cli
            go test ./... -count=1 -timeout=5m
        - name: web checks
          timeout: 15m
          script: |
            npm i -g pnpm@11.7.0
            pnpm install --frozen-lockfile
            pnpm test:gateway-policy
            pnpm test:console
            pnpm exec tsc --noEmit
            pnpm build

$:
  tag_push:
    - name: validate-release-tag
      stages:
        - name: validate-release-tag
          script: |
            case "${CNB_BRANCH}" in
              v[0-9]*.[0-9]*.[0-9]*) echo "release tag: ${CNB_BRANCH}" ;;
              *) echo "release tags must use vMAJOR.MINOR.PATCH" >&2; exit 1 ;;
            esac
