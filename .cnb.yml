$:
  vscode:
    - name: vscode codex dev env
      runner:
        cpus: 8
      services:
        - vscode
        - docker
      docker:
        image: docker.cnb.cool/l8ai/agentcloud/webide-codex:git-f3f43aa51d033d975b89fcfeec8c0a3abc8066e2
      imports:
        - https://cnb.cool/aiedulab/zhiyong/secret/-/blob/main/codex-dev-env.yml
      env:
        CODEX_HOME: /home/coder/.codex
        CODEX_BASE_URL: https://token.aiedulab.cn
        CODEX_MODEL: gpt-5.5
        CNB_WELCOME_CMD: codex-dev-init && codex --version
      stages:
        - name: 写入 Codex 凭据
          script: |
            codex-dev-init
            go version
            node --version
        - name: 打开 VS Code
          type: vscode:go
  # Releases run on cloud-dev nodes (services: vscode), which CNB allows only
  # for push, branch.create, vscode, web_trigger and api_trigger events, so a
  # pushed tag no longer starts the release. Start it from the tag with:
  #   cnb build start-build --repo l8ai/ai/doops.sh --tag vX.Y.Z --event api_trigger_release
  api_trigger_release:
    - name: publish-release
      runner:
        cpus: 4
      services:
        - docker
        # Declaring vscode runs this pipeline on cloud-dev nodes, billed on the
        # cloud-dev quota instead of the build quota. Nobody connects to the
        # environment, so keep it alive past the default 10-minute idle recycle.
        - name: vscode
          options:
            keepAliveTimeout: 2h
      docker:
        image: docker.io/library/golang:1.25-alpine@sha256:1ae0735f00daffa3aaf1363a5184c0d2dc55c78e3db4ec70241cdac97bf84b59
      stages:
        - name: require a release tag
          script: |
            set -eu
            test "${CNB_IS_TAG:-}" = "true" || { echo "release must be started from a tag (--tag vX.Y.Z)" >&2; exit 2; }
            printf '%s' "${CNB_BRANCH}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "release tag must be vX.Y.Z, got ${CNB_BRANCH}" >&2; exit 2; }
        - name: prepare tools
          script: apk add --no-cache bash curl docker-cli git helm nodejs npm openssh-client python3 py3-pytest py3-yaml
        - name: release contract tests
          script: python3 -m pytest backend/test -q
        - name: agent tests
          script: |
            cd backend/agent
            go test ./...
        - name: gateway tests
          script: |
            cd backend/gateway
            go test ./...
        - name: cli tests
          script: |
            cd backend/cli
            go test ./...
        - name: web build
          script: |
            npm i -g pnpm@11.7.0
            pnpm install --frozen-lockfile
            pnpm test:gateway-policy
            pnpm test:console
            pnpm exec tsc --noEmit
            pnpm build
        - name: resolve release agent base
          script: |
            DOOPS_BASE_IMAGE_OUTPUT="${PWD}/backend/.ci-agent-base-image" \
              bash backend/scripts/resolve-agent-base-image.sh
        - name: build release agent image
          script: |
            export DOOPS_AGENT_BASE_IMAGE_OVERRIDE="$(cat backend/.ci-agent-base-image)"
            DOOPS_RELEASE_TAG="${CNB_BRANCH}" bash backend/scripts/build-agent-image.sh
        - name: build release web image
          script: DOOPS_RELEASE_TAG="${CNB_BRANCH}" bash backend/scripts/build-web-image.sh
        - name: build CLI release assets
          script: |
            rm -rf backend/dist/cli
            DOOPS_CLI_VERSION="${CNB_BRANCH}" \
            DOOPS_CLI_COMMIT="${CNB_COMMIT}" \
            DOOPS_CLI_OUT="${PWD}/backend/dist/cli/doops-host" \
            DOOPS_CLI_RELEASE_DIR="${PWD}/backend/dist/cli" \
              bash backend/scripts/build-cli.sh --all
        - name: publish CLI release assets
          script: |
            node backend/scripts/publish-cli-release.mjs \
              --repo "${CNB_REPO_SLUG_LOWERCASE}" \
              --tag "${CNB_BRANCH}" \
              --commit "${CNB_COMMIT}" \
              --dir "${PWD}/backend/dist/cli" \
              --image "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH}"
        - name: verify published CLI release assets
          script: |
            DOOPS_RELEASE_TAG="${CNB_BRANCH}" \
            DOOPS_RELEASE_COMMIT="${CNB_COMMIT}" \
              bash backend/scripts/verify-published-cli-release.sh
