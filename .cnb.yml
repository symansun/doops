$:
  tag_push:
    - name: publish-release
      runner:
        cpus: 4
      services:
        - docker
      docker:
        image: docker.io/library/golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191
      stages:
        - name: prepare tools
          script: apk add --no-cache bash curl docker-cli git helm nodejs npm python3 py3-pytest py3-yaml
        - name: release contract tests
          script: python3 -m pytest backend/test -q
        - name: agent tests
          script: |
            cd backend/agent
            go test ./...
        - name: gateway tests
          script: |
            cd backend/gateway
            go test ./...
        - name: cli tests
          script: |
            cd backend/skills/doops-cli
            go test ./...
        - name: web build
          script: |
            npm i -g pnpm@11.7.0
            pnpm install --frozen-lockfile
            pnpm test:gateway-policy
            pnpm exec tsc --noEmit
            pnpm build
        - name: build release agent image
          script: DOOPS_RELEASE_TAG="${CNB_BRANCH}" bash backend/scripts/build-agent-image.sh
        - name: build release web image
          script: DOOPS_RELEASE_TAG="${CNB_BRANCH}" bash backend/scripts/build-web-image.sh
        - name: build CLI release assets
          script: |
            rm -rf backend/dist/cli
            DOOPS_CLI_VERSION="${CNB_BRANCH}" \
            DOOPS_CLI_COMMIT="${CNB_COMMIT}" \
            DOOPS_CLI_OUT="${PWD}/backend/dist/cli/doops-host" \
            DOOPS_CLI_RELEASE_DIR="${PWD}/backend/dist/cli" \
              bash backend/scripts/build-cli.sh --all
        - name: publish CLI release assets
          script: |
            node backend/scripts/publish-cli-release.mjs \
              --repo "${CNB_REPO_SLUG_LOWERCASE}" \
              --tag "${CNB_BRANCH}" \
              --commit "${CNB_COMMIT}" \
              --dir "${PWD}/backend/dist/cli" \
              --image "${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}:${CNB_BRANCH}"
        - name: verify published CLI release assets
          script: |
            DOOPS_RELEASE_TAG="${CNB_BRANCH}" \
            DOOPS_RELEASE_COMMIT="${CNB_COMMIT}" \
              bash backend/scripts/verify-published-cli-release.sh
  api_trigger_deploy_agent:
    - name: deploy agent through natural-language apply
      runner:
        cpus: 2
      imports:
        - https://cnb.cool/aiedulab/auto-harness-secret/-/blob/main/secrets.yml
      docker:
        image: docker.io/library/golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191
      stages:
        - name: prepare Gateway CLI
          script: |
            set -eu
            apk add --no-cache bash git
            : "${DOOPS_GATEWAY_TOKEN:?DOOPS_GATEWAY_TOKEN is required}"
            : "${DOOPS_TARGET:?DOOPS_TARGET is required}"
            : "${DOOPS_CLUSTER:?DOOPS_CLUSTER is required}"
            : "${DOOPS_INSTANCE:?DOOPS_INSTANCE is required}"
            ROOT="${PWD}"
            export HOME="${PWD}/.ci-doops-home"
            mkdir -p "${HOME}" .ci-bin
            (
              cd backend/skills/doops-cli
              go build -o "${ROOT}/.ci-bin/doops" ./cli/doops
            )
            .ci-bin/doops add \
              --name "${DOOPS_TARGET}" \
              --gateway "https://doops.l8ai.cn" \
              --cluster "${DOOPS_CLUSTER}" \
              --instance "${DOOPS_INSTANCE}" \
              --use "CNB natural-language release"
            .ci-bin/doops login --target "${DOOPS_TARGET}" --token "${DOOPS_GATEWAY_TOKEN}"
            .ci-bin/doops targets --target "${DOOPS_TARGET}"
        - name: publish through Gateway
          script: |
            set -eu
            : "${DOOPS_SESSION:?DOOPS_SESSION is required}"
            : "${DOOPS_TARGET:?DOOPS_TARGET is required}"
            : "${DOOPS_IMAGE:?DOOPS_IMAGE is required}"
            : "${DOOPS_SERVICE_SCOPE:?DOOPS_SERVICE_SCOPE is required}"
            : "${DOOPS_HELM_ASSET:?DOOPS_HELM_ASSET is required}"
            : "${DOOPS_CHANGE_REASON:?DOOPS_CHANGE_REASON is required}"
            : "${DOOPS_ACCEPTANCE:?DOOPS_ACCEPTANCE is required}"
            printf '%s' "${DOOPS_IMAGE}" | grep -Eq '@sha256:[a-f0-9]{64}$'
            printf '%s' "${DOOPS_HELM_ASSET}" | grep -Eq '^deploy/helm/[A-Za-z0-9._/-]+/?$'
            export HOME="${PWD}/.ci-doops-home"
            .ci-bin/doops -session "${DOOPS_SESSION}" push \
              --target "${DOOPS_TARGET}" \
              --src .
            instruction="在 ${DOOPS_TARGET} 发布 ${DOOPS_SERVICE_SCOPE}，镜像 ${DOOPS_IMAGE}；仅使用 ${DOOPS_HELM_ASSET}；原因：${DOOPS_CHANGE_REASON}；验收：${DOOPS_ACCEPTANCE}。"
            if [ -n "${DOOPS_CREDENTIAL:-}" ]; then
              .ci-bin/doops -session "${DOOPS_SESSION}" ask \
                --target "${DOOPS_TARGET}" \
                --apply \
                --credential "${DOOPS_CREDENTIAL}" \
                --msg "${instruction}"
            else
              .ci-bin/doops -session "${DOOPS_SESSION}" ask \
                --target "${DOOPS_TARGET}" \
                --apply \
                --msg "${instruction}"
            fi
