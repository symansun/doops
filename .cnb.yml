$:
  tag_push:
    - name: publish-cli-release-assets
      runner:
        cpus: 2
      docker:
        image: docker.io/library/golang:1.24-alpine@sha256:8bee1901f1e530bfb4a7850aa7a479d17ae3a18beb6e09064ed54cfd245b7191
      stages:
        - name: prepare tools
          script: apk add --no-cache bash curl git nodejs
        - name: release contract tests
          script: |
            apk add --no-cache python3 py3-pytest py3-yaml
            python3 -m pytest backend/test -q
        - name: build CLI release assets
          script: |
            rm -rf backend/dist/cli
            DOOPS_CLI_OUT="${PWD}/backend/dist/cli/doops-host" \
            DOOPS_CLI_RELEASE_DIR="${PWD}/backend/dist/cli" \
              bash backend/scripts/build-cli.sh --all
        - name: publish CLI release assets
          script: |
            node backend/scripts/publish-cli-release.mjs \
              --repo "${CNB_REPO}" \
              --tag "${CNB_BRANCH}" \
              --commit "${CNB_COMMIT}" \
              --dir "${PWD}/backend/dist/cli"
        - name: verify published CLI release assets
          script: DOOPS_RELEASE_TAG="${CNB_BRANCH}" bash backend/scripts/verify-published-cli-release.sh
