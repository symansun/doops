image:
  repository: ""
  tag: latest
  digest: ""
  pullPolicy: Always

workload:
  name: ""
  selectorLabels:
    app: doops-agent

imagePullSecrets: []

serviceAccount:
  # Empty keeps the namespace default ServiceAccount.
  name: ""

kubeconfig:
  # mounted: /root/.kube/config comes from a volume.
  # serviceAccount: the entrypoint writes it from the Pod ServiceAccount token.
  source: mounted

gateway:
  url: ""
  cluster: ""
  instance: ""

proxy:
  # Empty rejects every public proxy upstream until an operator explicitly allows one.
  allowedHosts: ""

nodeSelector: {}

tolerations: []

hostAliases: []

# Enter the node that runs this Pod. Default false keeps the Pod in its own
# PID namespace. true shares the node PID namespace and mounts the node root
# read-only at /host. hostNetwork stays off.
hostAccess:
  enabled: false

volumeMounts: []

volumes: []
