image:
  repository: ""
  tag: latest
  digest: ""
  pullPolicy: Always

workload:
  name: ""
  selectorLabels:
    app: doops-agent

modelRouting:
  policy: ""

doagentSettings:
  secretName: ""
  key: ""

imagePullSecrets: []

serviceAccount:
  # Empty keeps the namespace default ServiceAccount.
  name: ""

kubeconfig:
  # mounted: /root/.kube/config comes from a volume.
  # serviceAccount: the entrypoint writes it from the Pod ServiceAccount token.
  source: mounted

gateway:
  url: ""
  cluster: ""
  instance: ""

proxy:
  # Empty rejects every public proxy upstream until an operator explicitly allows one.
  allowedHosts: ""

nodeSelector: {}

tolerations: []

hostAliases: []

volumeMounts: []

volumes: []
