# DoOps Agent Kubernetes Helm values.
# Full environment variable reference and defaults:
#   - backend/docs/CONFIGURATION.md
#   - backend/docs/RUNTIME_LIMITS.md
# Never commit real enrollment tokens, kubeconfigs, or secret payloads to Git.

image:
  repository: ""
  # Recommended: leave tag empty and pin image.digest to the verified
  # sha256 the publisher built. `latest` is kept as the default for backward
  # compatibility only; it is not an immutable reference.
  tag: latest
  digest: ""
  pullPolicy: Always

workload:
  name: ""
  selectorLabels:
    app: doops-agent

imagePullSecrets: []

serviceAccount:
  # Empty keeps the namespace default ServiceAccount.
  name: ""

rbac:
  # Explicitly manage a dedicated ServiceAccount and its RoleBinding (or
  # ClusterRoleBinding when namespaces is empty). Requires
  # kubeconfig.source=serviceAccount and serviceAccount.name.
  create: false
  # The ClusterRole granted to the ServiceAccount; existing ClusterRole or
  # namespaced Role name, never a rule list here.
  clusterRole: cluster-admin
  # Empty binds clusterRole cluster-wide through a ClusterRoleBinding named
  # <namespace>-<serviceAccount>-cluster-admin. A non-empty list binds the role
  # in each namespace through RoleBindings named
  # <namespace>-<serviceAccount>-<clusterRole>. roleRef is immutable, so the
  # binding name follows the role.
  namespaces: []

kubeconfig:
  # Mapped to container env DOOPS_KUBECONFIG_SOURCE:
  # - mounted: /root/.kube/config comes from a mounted volume.
  # - serviceAccount: the entrypoint writes it from the Pod ServiceAccount token
  #   (requires a dedicated serviceAccount.name, never "default").
  source: mounted

gateway:
  # Mapped to container env DOOPS_GATEWAY_URL / DOOPS_GATEWAY_CLUSTER / DOOPS_GATEWAY_INSTANCE
  # and forwarded by templates/deployment.yaml to -gateway-url / -cluster / -instance.
  url: ""
  cluster: ""
  instance: ""
  # Optional Kubernetes Secret name injected as DOOPS_AGENT_ENROLL_TOKEN via secretKeyRef.
  # Gateway defaults to open registration for targets without a confirmed token, so this
  # may stay empty unless the Gateway sets DOOPS_REQUIRE_AGENT_ENROLLMENT=1 or this target
  # has already connected with an enrollment token (after which the token stays mandatory).
  enrollmentTokenSecret: ""
  enrollmentTokenKey: token

proxy:
  # Mapped to DOOPS_PROXY_ALLOW_HOSTS (comma-separated exact hostnames).
  # Empty rejects every public proxy upstream until an operator explicitly allows one.
  allowedHosts: ""

# Mapped to DOOPS_COMMAND_DENY_RULES (JSON array) as guardrails against mistakes:
# [{name, match, hint}]. Invalid regexes or duplicate names fail closed.
# This is not a security boundary. A target grant still authorizes every command,
# and any rule can be bypassed by a caller. Do not present these rules as
# protection of one user from another.
commandDenyRules: []

# Mapped to DOOPS_TOOL_TIMEOUT: Agent 侧单条命令的保险上限（例如 "2h"）。
# 留空表示跟随 Gateway 的 -operation-timeout（默认 30m 兜底）；设置后取它与
# Gateway 时限中较短的一个（非法 duration 会导致启动失败）。
toolTimeout: ""

# Mapped to DOOPS_DOSQL_STATE_DIR: DoSql 持久化状态目录（绝对路径，例如 "/var/lib/doops-dosql"）。
# 留空沿用默认路径（$(dirname workspaceRoot)/.doops-dosql-versions 与 .doops-dosql-drivers）；
# 生产环境建议配合下方 volumeMounts/volumes 挂载独立 PVC，统一持久化版本链、SQL 历史、
# SchemaIR 快照与外置驱动，避免 Agent Pod 重建后丢失版本和漂移基线。
dosql:
  stateDir: ""

nodeSelector: {}

tolerations: []

hostAliases: []

# Enter the node that runs this Pod. Default true shares the node PID
# namespace and mounts the node root read-only at /host. Set false to keep
# the Pod in its own PID namespace. hostNetwork stays off. Gateway exec
# grants and audit still control the nsenter command.
hostAccess:
  enabled: true

securityContext:
  # Privileged is required for hostAccess and for the Containerfile-style image
  # builds that buildkitd serves. With false the Pod still runs as root in its
  # own namespaces, cannot escalate, and drops every Linux capability; host
  # access and image builds then do not work. The render fails for
  # hostAccess.enabled with privileged=false instead of installing a Pod that
  # silently misses what the values ask for.
  privileged: true

volumeMounts: []

volumes: []
