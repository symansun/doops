apiVersion: doops.sh/v2
kind: DeploymentTemplate
metadata:
  name: credential-opaque-canary
  description: Verify managed opaque credential materialization without changing a workload
spec:
  application: doops-credential-acceptance
  environment: oilan
  configurationSource: backend/deploy/environments.yaml
  release:
    source:
      repository: https://cnb.cool/l8ai/ai/doops.sh.git
      branch: main
  credentialRefs:
    - name: doops-credential-opaque-canary
      use: opaqueSecret
      namespace: kz-ops
