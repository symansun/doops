title = "doops secret scanning"

[extend]
useDefault = true

[[rules]]
id = "doops-hardcoded-ssh-password"
description = "Hard-coded SSH password call"
regex = '''ssh\.Password\("[^"]{8,}"\)'''
tags = ["password", "ssh"]

[[allowlists]]
description = "Expected placeholders, metric identifiers, and checksums"
regexes = [
  '''<GATEWAY_USER_TOKEN>''',
  '''REPLACE_WITH_OPENAI_API_KEY''',
  '''example\.com''',
  '''modernc\.org/token''',
  '''k8s_pods_abnormal''',
]

[[allowlists]]
description = "Synthetic redaction and auth test fixtures"
paths = [
  '''_test\.go$''',
  '''\.test\.mjs$''',
]
