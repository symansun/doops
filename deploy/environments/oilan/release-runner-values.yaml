image:
  repository: docker.cnb.cool/l8ai/ai/doops.sh
  digest: sha256:23a78b4a1d1277aef6d75565e28601c1acb97cca98cb5401e27183efb67b6f1f
  pullPolicy: Always

workload:
  name: doops-release-runner
  selectorLabels:
    app: doops-release-runner

modelRouting:
  policy: single-model

imagePullSecrets: []

gateway:
  url: https://doops.l8ai.cn
  cluster: doops-edu
  instance: release-runner

nodeSelector:
  kubernetes.io/hostname: 192.168.0.24

doagentSettings:
  secretName: doagent-model-settings
  key: settings.json

volumeMounts:
  - name: kube-admin
    mountPath: /etc/kubernetes/admin.conf
    readOnly: true
  - name: kube-admin
    mountPath: /root/.kube/config
    readOnly: true
  - name: agent-home
    mountPath: /root
  - name: doagent-config
    mountPath: /opt/doagent_config
    readOnly: true
  - name: containerd-socket
    mountPath: /run/containerd/containerd.sock
  - name: nerdctl-bin
    mountPath: /usr/local/bin/nerdctl
    readOnly: true
  - name: nerdctl-real-bin
    mountPath: /usr/local/bin/nerdctl.real
    readOnly: true
  - name: crictl-bin
    mountPath: /usr/bin/crictl
    readOnly: true

volumes:
  - name: kube-admin
    hostPath:
      path: /etc/kubernetes/admin.conf
      type: File
  - name: agent-home
    hostPath:
      path: /var/lib/doops-release-runner-home
      type: DirectoryOrCreate
  - name: containerd-socket
    hostPath:
      path: /run/containerd/containerd.sock
      type: Socket
  - name: nerdctl-bin
    hostPath:
      path: /usr/bin/nerdctl
      type: File
  - name: nerdctl-real-bin
    hostPath:
      path: /usr/local/bin/nerdctl.real
      type: File
  - name: crictl-bin
    hostPath:
      path: /usr/bin/crictl
      type: File
