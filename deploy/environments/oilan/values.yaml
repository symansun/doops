image:
  repository: docker.cnb.cool/l8ai/ai/doops.sh
  digest: sha256:fefb4ec9b6c49e94d684053405296d49004882f4b0548b673e40184ffd8ba24e
  pullPolicy: Always

workload:
  name: doops-agent-live

modelRouting:
  policy: single-model

imagePullSecrets: []

gateway:
  url: https://doops.l8ai.cn
  cluster: doops-edu
  instance: edu-coder

nodeSelector:
  kubernetes.io/hostname: 192.168.0.24

hostAliases:
  - ip: 192.168.0.24
    hostnames:
      - apiserver.cluster.local

doagentSettings:
  secretName: doagent-model-settings
  key: settings.json

volumeMounts:
  - name: kube-admin
    mountPath: /etc/kubernetes/admin.conf
    readOnly: true
  - name: kube-admin
    mountPath: /root/.kube/config
    readOnly: true
  - name: agent-home
    mountPath: /root
  - name: doagent-config
    mountPath: /opt/doagent_config
    readOnly: true
  - name: containerd-socket
    mountPath: /run/containerd/containerd.sock
  - name: nerdctl-bin
    mountPath: /usr/local/bin/nerdctl
    readOnly: true
  - name: nerdctl-real-bin
    mountPath: /usr/local/bin/nerdctl.real
    readOnly: true
  - name: crictl-bin
    mountPath: /usr/bin/crictl
    readOnly: true

volumes:
  - name: kube-admin
    hostPath:
      path: /etc/kubernetes/admin.conf
      type: File
  - name: agent-home
    hostPath:
      path: /var/lib/doops-agent-home
      type: DirectoryOrCreate
  - name: containerd-socket
    hostPath:
      path: /run/containerd/containerd.sock
      type: Socket
  - name: nerdctl-bin
    hostPath:
      path: /usr/bin/nerdctl
      type: File
  - name: nerdctl-real-bin
    hostPath:
      path: /usr/local/bin/nerdctl.real
      type: File
  - name: crictl-bin
    hostPath:
      path: /usr/bin/crictl
      type: File
