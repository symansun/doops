  artifact:
    source: docker.cnb.cool/l8ai/ai/doops.sh
    target: docker.cnb.cool/l8ai/ai/doops.sh
    identity: sha256-digest
    digest: sha256:e43a2b207fcf0a6e734216d6ac3cb95235a7fd13d36e7a566aadb48c9a67033c
