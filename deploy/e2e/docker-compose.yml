# Isolated E2E test topology, driven by smoke.sh --mode compose.
# Agent registration declares only the exact cluster/instance; it has no token.
services:
  gateway:
    image: ${E2E_IMAGE:?smoke.sh must select a unique test image}
    build:
      context: ../..
      dockerfile: deploy/e2e/Dockerfile
    command: ["/app/doops-gateway", "serve", "-port", "42222", "-db", "/data/gateway.db"]
    volumes:
      - gwdata:/data
    ports:
      - "127.0.0.1:${E2E_GATEWAY_PORT:?smoke.sh must select a free port}:42222"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:42222/health"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  agent:
    image: ${E2E_IMAGE:?smoke.sh must select a unique test image}
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      DOOPS_WORKSPACE_ROOT: /root/ws
    command:
      - /app/doops-agent
      - -gateway-url
      - ws://gateway:42222
      - -cluster
      - ${E2E_CLUSTER:?smoke.sh must select the cluster}
      - -instance
      - ${E2E_INSTANCE:?smoke.sh must select the instance}

volumes:
  gwdata:
